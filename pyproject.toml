[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factraiser"
version = "0.1.0"
description = "Tiered AI memory for enterprises: personal, team, and org memory with permissions and guardrails, exposed over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
insights = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
factraiser = "factraiser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
